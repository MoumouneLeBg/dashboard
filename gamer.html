<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<title>Gaming Room</title>
<style>
  :root { --acc: #ff3b5c; --bg: #07080c; --card: #11131a; --line: #1d2030; --txt: #e8e8ee; --dim: #6b6f85; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
    font-family: -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse at 85% 0%, rgba(255,59,92,.13), transparent 55%),
                     radial-gradient(ellipse at 0% 100%, rgba(80,90,255,.10), transparent 50%), var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1000px; height: 620px;
    -webkit-transform-origin: 0 0; transform-origin: 0 0; transition: opacity 1.5s; }
  body.nuit #stage { opacity: .4; }
  .wrap { display: flex; height: 100%; padding: 18px; box-sizing: border-box; }
  .left { width: 370px; display: flex; flex-direction: column; }
  .right { flex: 1; margin-left: 18px; display: flex; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 20px; box-sizing: border-box; position: relative; overflow: hidden; }
  .card + .card { margin-top: 18px; }
  .grow { flex: 1; min-height: 0; }
  .label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .label.acc { color: var(--acc); }
  .head { display: flex; align-items: center; }
  .head .label + .label { margin-left: auto; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }

  /* Heure */
  .time { text-align: center; padding-top: 22px; padding-bottom: 22px; }
  .time:before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--acc), transparent); }
  .t-big { font-size: 112px; font-weight: 200; line-height: 1; letter-spacing: -3px; }
  .t-big span { font-size: 30px; color: var(--acc); letter-spacing: 0; margin-left: 6px; font-weight: 300; }
  .t-date { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; color: var(--dim); margin-top: 10px; }

  /* Météo */
  .w { display: flex; flex-direction: column; }
  .w-top { display: flex; align-items: center; margin-top: 14px; }
  .w-top .ic { width: 64px; height: 64px; stroke-width: 1.2; }
  .w-temp { font-size: 76px; font-weight: 200; line-height: 1; margin-left: 10px; letter-spacing: -2px; }
  .w-desc { margin-left: 16px; font-size: 15px; color: var(--dim); line-height: 1.6; }
  .w-desc b { color: var(--txt); font-weight: 500; font-size: 17px; }
  .w-rain { margin-top: 14px; font-size: 14px; color: #8fb4ff; }
  .w-rain .ic { width: 16px; height: 16px; margin-right: 5px; vertical-align: -3px; }
  .w-hours { display: flex; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .w-h { flex: 1; text-align: center; font-size: 12px; color: var(--dim); }
  .w-h .ic { display: block; margin: 7px auto; width: 24px; height: 24px; color: var(--txt); }
  .w-h b { font-size: 16px; color: var(--txt); font-weight: 400; }
  .w-h i { display: block; font-style: normal; font-size: 11px; color: #8fb4ff; height: 13px; margin-top: 3px; }

  /* The Finals */
  .tf { flex: 1; display: flex; flex-direction: column; }
  .feat { margin-top: 14px; cursor: pointer; }
  .feat-img { height: 170px; border-radius: 12px; overflow: hidden; background: #1a1c26; position: relative; }
  .feat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 12px; top: 12px; background: var(--acc); color: #fff; font-size: 11px;
    font-weight: 700; letter-spacing: 2px; padding: 5px 10px; border-radius: 6px; }
  .feat-t { font-size: 26px; font-weight: 600; margin-top: 14px; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feat-m { font-size: 13px; color: var(--dim); margin-top: 6px; }
  .feat-m span { color: var(--acc); }
  .list { margin-top: 14px; flex: 1; min-height: 0; overflow: hidden; }
  .it { display: flex; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .it-t { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--acc); border: 1px solid var(--acc);
    border-radius: 4px; padding: 2px 6px; margin-right: 10px; }
  .it-d { font-size: 12px; color: var(--dim); margin-left: 12px; white-space: nowrap; }
  .hint { font-size: 11px; color: #3d4152; text-align: center; margin-top: 6px; }

  /* Fenêtre patch notes */
  #modal { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.open { display: flex; }
  .m-box { background: var(--card); border: 1px solid var(--line); border-radius: 20px; width: 92%; max-width: 900px;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .m-imgwrap { height: 120px; position: relative; background: #1a1c26; overflow: hidden; }
  .m-imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .m-imgwrap span { position: absolute; right: 12px; top: 12px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; padding: 5px 10px; border-radius: 12px; }
  .m-box.noimg .m-imgwrap { display: none; }
  .m-content { padding: 22px 28px 12px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    max-height: calc(88vh - 120px - 58px); }
  .m-box.noimg .m-content { max-height: calc(88vh - 58px); }
  .m-title { font-size: 26px; font-weight: 600; }
  .m-meta { font-size: 12px; color: var(--acc); letter-spacing: 2px; margin-top: 8px; text-transform: uppercase; }
  .m-text { font-size: 18px; line-height: 1.55; color: #c4c6d2; margin-top: 16px; white-space: pre-line;
    -webkit-user-select: text; user-select: text; }
  .m-close { border: 0; border-top: 1px solid var(--line); background: none; color: var(--txt);
    font-size: 16px; padding: 18px; width: 100%; font-family: inherit; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <div class="wrap">

    <div class="left">
      <div class="card time">
        <div class="t-big" id="time">--:--</div>
        <div class="t-date" id="date"></div>
      </div>
      <div class="card w grow" id="weather">
        <div class="head"><span class="label">Météo</span></div>
        <div class="w-desc" style="margin:14px 0 0">Chargement…</div>
      </div>
    </div>

    <div class="right">
      <div class="card tf" id="tf">
        <div class="head"><span class="label acc">The Finals</span><span class="label">Mises à jour · Steam</span></div>
        <div class="feat-t" style="font-size:18px;font-weight:400;color:#6b6f85">Chargement des patch notes…</div>
      </div>
    </div>

  </div>
</div>

<div id="modal">
  <div class="m-box" id="mbox">
    <div class="m-imgwrap" id="mimgwrap"><img id="mimg" alt=""><span>Masquer l'image</span></div>
    <div class="m-content" id="mcontent">
      <div class="m-title" id="mtitle"></div>
      <div class="m-meta" id="mmeta"></div>
      <div class="m-text" id="mtext"></div>
    </div>
    <button class="m-close" id="mclose">Fermer</button>
  </div>
</div>

<script>
/* ===== RÉGLAGES ===== */
var CONFIG = {
  ville: 'Agen',
  lat: 44.2033,
  lon: 0.6163,
  steamAppId: 2073850,   // THE FINALS sur Steam
  couleur: '#ff3b5c',    // couleur d'accent (ex. '#00e5ff' cyan, '#9b5cff' violet)
  nuitDebut: 1,          // écran assombri de 1 h…
  nuitFin: 8             // …à 8 h
};
/* ==================== */

document.documentElement.style.setProperty('--acc', CONFIG.couleur);

var JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function $(id) { return document.getElementById(id); }

/* Mise à l'échelle : la page s'adapte à n'importe quel écran */
function fit() {
  var w = window.innerWidth, h = window.innerHeight, s = Math.min(w / 1000, h / 620);
  var t = 'translate(' + Math.round((w - 1000 * s) / 2) + 'px,' + Math.round((h - 620 * s) / 2) + 'px) scale(' + s + ')';
  $('stage').style.webkitTransform = t;
  $('stage').style.transform = t;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
fit();

var ICONS = {
  sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6L6 6M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  partly: '<path d="M8 2.5v1.2M2.5 8h1.2M4.1 4.1l.9.9M11.9 4.1l-.9.9"/><path d="M5.2 10.6A3.2 3.2 0 0 1 10.6 6.4"/><path d="M19 13h-1a6 6 0 1 0-6 7h7a3.5 3.5 0 0 0 0-7z"/>',
  cloud: '<path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
  rain: '<path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><path d="M16 13v8M8 13v8M12 15v8"/>',
  snow: '<path d="M20 17.6A5 5 0 0 0 18 8h-1.3A8 8 0 1 0 4 16.3"/><path d="M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>',
  storm: '<path d="M19 16.9A5 5 0 0 0 18 7h-1.3a8 8 0 1 0-11.6 9"/><path d="M13 11l-4 6h6l-4 6"/>',
  fog: '<path d="M3 8h18M5 12h14M3 16h18M7 20h10"/>',
  drop: '<path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/>'
};
function icon(n) { return '<svg class="ic" viewBox="0 0 24 24">' + ICONS[n] + '</svg>'; }
function meteoType(code, isDay) {
  if (code === 0) return isDay === 0 ? 'moon' : 'sun';
  if (code <= 2) return 'partly';
  if (code === 3) return 'cloud';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 95) return 'storm';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  return 'rain';
}
var DESC = { sun: 'Ensoleillé', moon: 'Dégagé', partly: 'Éclaircies', cloud: 'Couvert',
  fog: 'Brouillard', rain: 'Pluie', snow: 'Neige', storm: 'Orage' };

function getJSON(url, ok, ko) {
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.timeout = 15000;
  x.onload = function () {
    if (x.status >= 200 && x.status < 300) { try { ok(JSON.parse(x.responseText)); } catch (e) { if (ko) ko(); } }
    else if (ko) ko();
  };
  x.onerror = x.ontimeout = function () { if (ko) ko(); };
  x.send();
}

/* ----- Heure ----- */
function tick() {
  var n = new Date(), h = n.getHours();
  $('time').innerHTML = pad(h) + ':' + pad(n.getMinutes()) + '<span>' + pad(n.getSeconds()) + '</span>';
  $('date').innerHTML = JOURS[n.getDay()] + ' ' + n.getDate() + ' ' + MOIS[n.getMonth()];
  var a = CONFIG.nuitDebut, b = CONFIG.nuitFin;
  var nuit = a > b ? (h >= a || h < b) : (h >= a && h < b);
  if (nuit) document.body.classList.add('nuit'); else document.body.classList.remove('nuit');
}

/* ----- Météo ----- */
function loadWeather() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current_weather=true&daily=temperature_2m_max,temperature_2m_min' +
    '&hourly=temperature_2m,precipitation_probability,weathercode,is_day&timezone=auto&forecast_days=2';
  getJSON(url, function (d) {
    var c = d.current_weather, hr = d.hourly, t = meteoType(c.weathercode, c.is_day), i;
    var start = 0;
    while (start < hr.time.length && hr.time[start] <= c.time) start++;
    var rainAt = -1;
    for (i = start; i < start + 12 && i < hr.time.length; i++) {
      if (rainAt < 0 && (hr.precipitation_probability[i] || 0) >= 50) rainAt = i;
    }
    var rain = rainAt === start ? 'Pluie probable dans l\'heure'
      : rainAt > 0 ? 'Pluie probable vers ' + parseInt(hr.time[rainAt].substr(11, 2), 10) + ' h'
      : 'Pas de pluie prévue dans les 12 h';
    var h = '<div class="head"><span class="label">Météo</span><span class="label">' + CONFIG.ville + '</span></div>' +
      '<div class="w-top">' + icon(t) + '<div class="w-temp">' + Math.round(c.temperature) + '°</div>' +
      '<div class="w-desc"><b>' + DESC[t] + '</b><br>Max ' + Math.round(d.daily.temperature_2m_max[0]) +
      '° · Min ' + Math.round(d.daily.temperature_2m_min[0]) + '°<br>Vent ' + Math.round(c.windspeed) + ' km/h</div></div>' +
      '<div class="w-rain">' + icon('drop') + rain + '</div><div class="w-hours">';
    for (i = start; i < start + 10 && i < hr.time.length; i += 2) {
      var p = hr.precipitation_probability[i] || 0;
      h += '<div class="w-h">' + parseInt(hr.time[i].substr(11, 2), 10) + ' h' +
        icon(meteoType(hr.weathercode[i], hr.is_day[i])) + '<b>' + Math.round(hr.temperature_2m[i]) + '°</b>' +
        '<i>' + (p >= 10 ? p + ' %' : '') + '</i></div>';
    }
    $('weather').innerHTML = h + '</div>';
  }, function () { setTimeout(loadWeather, 60000); });
}

/* ----- The Finals : actus Steam ----- */
var news = [];
function textOf(html) {
  try { return new DOMParser().parseFromString(html || '', 'text/html').body.textContent || ''; }
  catch (e) { return ''; }
}
function notesOf(html) {
  var s = (html || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<li[^>]*>/gi, '• ')
    .replace(/<(h[1-6])[^>]*>/gi, '\n\n')
    .replace(/<\/(p|div|h[1-6]|li|ul|ol)>/gi, '\n');
  return textOf(s).replace(/[ \t ]+/g, ' ').replace(/ *\n */g, '\n')
    .replace(/\n{3,}/g, '\n\n').replace(/^\s+|\s+$/g, '');
}
function dateOf(str) { return new Date((str || '').replace(' ', 'T') + 'Z'); }
function ago(str) {
  var min = Math.round((Date.now() - dateOf(str).getTime()) / 60000);
  if (isNaN(min)) return '';
  if (min < 60) return 'il y a ' + Math.max(min, 1) + ' min';
  if (min < 1440) return 'il y a ' + Math.round(min / 60) + ' h';
  var j = Math.round(min / 1440);
  return 'il y a ' + j + ' jour' + (j > 1 ? 's' : '');
}
function shortDate(str) { var d = dateOf(str); return isNaN(d) ? '' : d.getDate() + ' ' + MOIS[d.getMonth()].substr(0, 4).replace(/\.$/, ''); }
function isUpdate(t) { return /update|patch|hotfix|mise à jour/i.test(t); }
function imgOf(it) {
  if (it.thumbnail) return it.thumbnail;
  if (it.enclosure && it.enclosure.link && (!it.enclosure.type || it.enclosure.type.indexOf('image') === 0)) return it.enclosure.link;
  return '';
}

function renderTF() {
  if (!news.length) return;
  var f = news[0], fresh = (Date.now() - dateOf(f.pubDate).getTime()) < 3 * 86400000;
  var h = '<div class="head"><span class="label acc">The Finals</span><span class="label">Mises à jour · Steam</span></div>' +
    '<div class="feat" data-i="0"><div class="feat-img">' + (imgOf(f) ? '<img alt="">' : '') +
    (fresh ? '<div class="badge">NOUVEAU</div>' : '') + '</div>' +
    '<div class="feat-t"></div><div class="feat-m"><span>' + ago(f.pubDate) + '</span> · Touche pour lire le patch note</div></div>' +
    '<div class="list">';
  for (var i = 1; i < news.length && i < 6; i++) {
    h += '<div class="it" data-i="' + i + '">' + (isUpdate(news[i]._t) ? '<span class="tag">MAJ</span>' : '') +
      '<div class="it-t"></div><div class="it-d">' + shortDate(news[i].pubDate) + '</div></div>';
  }
  $('tf').innerHTML = h + '</div>';
  var im = $('tf').querySelector('.feat-img img');
  if (im) { im.onerror = function () { im.style.display = 'none'; }; im.src = imgOf(f); }
  $('tf').querySelector('.feat-t').textContent = f._t;
  var titles = $('tf').querySelectorAll('.it-t');
  for (var j = 0; j < titles.length; j++) titles[j].textContent = news[j + 1]._t;
}

function loadTF() {
  var rss = 'https://store.steampowered.com/feeds/news/app/' + CONFIG.steamAppId + '/';
  getJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rss), function (d) {
    if (d.status !== 'ok' || !d.items || !d.items.length) return;
    news = d.items;
    for (var i = 0; i < news.length; i++) news[i]._t = textOf(news[i].title).replace(/^\s+|\s+$/g, '');
    renderTF();
  }, function () {
    if (!news.length) setTimeout(loadTF, 120000);
  });
}

$('tf').addEventListener('click', function (e) {
  var el = e.target;
  while (el && el !== this && !(el.getAttribute && el.getAttribute('data-i') !== null)) el = el.parentNode;
  if (el && el !== this) openModal(+el.getAttribute('data-i'));
}, false);

/* ----- Fenêtre de lecture ----- */
var closeTimer = null;
function openModal(i) {
  var it = news[i]; if (!it) return;
  var img = imgOf(it), box = $('mbox'), im = $('mimg');
  if (img) { box.className = 'm-box'; im.onerror = function () { box.className = 'm-box noimg'; }; im.src = img; }
  else box.className = 'm-box noimg';
  $('mtitle').textContent = it._t;
  $('mmeta').textContent = shortDate(it.pubDate) + ' · ' + ago(it.pubDate);
  $('mtext').textContent = notesOf(it.content || it.description) || 'Pas de détail disponible.';
  $('mcontent').scrollTop = 0;
  $('modal').className = 'open';
  if (closeTimer) clearTimeout(closeTimer);
  closeTimer = setTimeout(closeModal, 5 * 60 * 1000); // se ferme seul après 5 min
}
function closeModal() { $('modal').className = ''; }
$('mimgwrap').addEventListener('click', function () { $('mbox').className = 'm-box noimg'; }, false);
$('modal').addEventListener('click', function (e) {
  if (e.target === this || e.target.id === 'mclose') closeModal();
}, false);

/* ----- Garder l'écran allumé (Chrome récent) ----- */
function keepAwake() {
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
document.addEventListener('click', keepAwake, false);
keepAwake();

/* ----- Démarrage ----- */
tick();
setInterval(tick, 1000);
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
loadTF();
setInterval(loadTF, 30 * 60 * 1000);
setTimeout(function () { if ($('modal').className !== 'open') location.reload(); }, 6 * 3600 * 1000);
</script>
</body>
</html>
